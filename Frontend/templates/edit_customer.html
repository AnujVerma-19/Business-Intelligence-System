{% extends "base.html" %}

{% block title %}Edit Customer{% endblock %}

{% block content %}

<div class="form-page">

    <div class="form-card">

        <!-- Header -->
        <div class="form-header">

            <div>
                <div class="form-icon">✏️</div>

                <h2>Edit Customer</h2>

                <p>Update the customer information below</p>
            </div>

            <a href="{{ url_for('customers') }}" class="back-btn">
                ← Back
            </a>

        </div>

        <hr class="form-divider">

        <form method="POST">

            <!-- Personal Information -->
            <div class="form-section-title">
                Personal Information
            </div>

            <div class="row g-4">

                <div class="col-md-6">

                    <label
                        class="form-label-custom"
                        for="name"
                    >
                        Customer Name <span>*</span>
                    </label>

                    <input
                        id="name"
                        type="text"
                        name="name"
                        class="custom-input"
                        value="{{ customer.name }}"
                        placeholder="Enter customer name"
                        required
                    >

                </div>


                <div class="col-md-6">

                    <label
                        class="form-label-custom"
                        for="email"
                    >
                        Email
                    </label>

                    <input
                        id="email"
                        type="email"
                        name="email"
                        class="custom-input"
                        value="{{ customer.email }}"
                        placeholder="Enter customer email"
                    >

                </div>


                <div class="col-md-6">

                    <label
                        class="form-label-custom"
                        for="phone_no"
                    >
                        Phone
                    </label>

                    <input
                        id="phone_no"
                        type="text"
                        name="phone_no"
                        class="custom-input"
                        value="{{ customer.phone_no }}"
                        placeholder="Enter phone number"
                    >

                </div>


                <div class="col-md-6">

                    <label
                        class="form-label-custom"
                        for="registration_no"
                    >
                        Registration No
                    </label>

                    <input
                        id="registration_no"
                        type="text"
                        name="registration_no"
                        class="custom-input"
                        value="{{ customer.registration_no }}"
                        placeholder="Enter registration number"
                    >

                </div>

            </div>


            <!-- Address Information -->
            <div class="form-section-title form-section-spacing">
                Address Information
            </div>

            <div class="row g-4">

                <div class="col-md-12">

                    <label
                        class="form-label-custom"
                        for="address"
                    >
                        Address
                    </label>

                    <input
                        id="address"
                        type="text"
                        name="address"
                        class="custom-input"
                        value="{{ customer.address }}"
                        placeholder="Enter complete address"
                    >

                </div>


                <div class="col-md-6">

                    <label
                        class="form-label-custom"
                        for="area"
                    >
                        Area
                    </label>

                    <input
                        id="area"
                        type="text"
                        name="area"
                        class="custom-input"
                        value="{{ customer.area }}"
                        placeholder="Enter area"
                    >

                </div>


                <div class="col-md-6">

                    <label
                        class="form-label-custom"
                        for="pincode"
                    >
                        Pincode
                    </label>

                    <input
                        id="pincode"
                        type="number"
                        name="pincode"
                        class="custom-input"
                        value="{{ customer.pincode }}"
                        placeholder="Enter pincode"
                    >

                </div>

            </div>


            <!-- Customer Details -->
            <div class="form-section-title form-section-spacing">
                Customer Details
            </div>

            <div class="row g-4">

                <div class="col-md-6">

                    <label
                        class="form-label-custom"
                        for="customer_segment"
                    >
                        Customer Segment
                    </label>

                    <input
                        id="customer_segment"
                        type="text"
                        name="customer_segment"
                        class="custom-input"
                        value="{{ customer.customer_segment }}"
                        placeholder="e.g. Regular, Premium"
                    >

                </div>


                <div class="col-md-3">

                    <label
                        class="form-label-custom"
                        for="total_order"
                    >
                        Total Orders
                    </label>

                    <input
                        id="total_order"
                        type="number"
                        name="total_order"
                        class="custom-input"
                        value="{{ customer.total_order }}"
                        placeholder="0"
                    >

                </div>


                <div class="col-md-3">

                    <label
                        class="form-label-custom"
                        for="avg_order"
                    >
                        Average Order
                    </label>

                    <div class="input-with-prefix">

                        <span>₹</span>

                        <input
                            id="avg_order"
                            type="number"
                            step="0.01"
                            name="avg_order"
                            class="custom-input"
                            value="{{ customer.avg_order }}"
                            placeholder="0.00"
                        >

                    </div>

                </div>

            </div>


            <!-- Actions -->
            <div class="form-actions">

                <a
                    href="{{ url_for('customers') }}"
                    class="cancel-btn"
                >
                    Cancel
                </a>

                <button
                    type="submit"
                    class="save-btn"
                >
                    ✓ Update Customer
                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
