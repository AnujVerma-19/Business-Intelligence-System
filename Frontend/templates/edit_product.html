{% extends "base.html" %}

{% block title %}Edit Product{% endblock %}

{% block content %}

<div class="form-page">

    <div class="form-card">

        <!-- Header -->
        <div class="form-header">

            <div>
                <div class="form-icon">✏️</div>

                <h2>Edit Product</h2>

                <p>Update the product information below</p>
            </div>

            <a href="{{ url_for('products') }}" class="back-btn">
                ← Back
            </a>

        </div>

        <hr class="form-divider">

        <form method="POST">

            <div class="form-section-title">
                Product Information
            </div>

            <div class="row g-4">

                <!-- Product Name -->
                <div class="col-md-6">

                    <label
                        class="form-label-custom"
                        for="product_name"
                    >
                        Product Name <span>*</span>
                    </label>

                    <input
                        type="text"
                        class="custom-input"
                        id="product_name"
                        name="product_name"
                        placeholder="Enter product name"
                        value="{{ product.product_name }}"
                        required
                    >

                </div>


                <!-- Category -->
                <div class="col-md-6">

                    <label
                        class="form-label-custom"
                        for="category"
                    >
                        Category
                    </label>

                    <input
                        type="text"
                        class="custom-input"
                        id="category"
                        name="category"
                        placeholder="Enter category"
                        value="{{ product.category }}"
                    >

                </div>


                <!-- Brand -->
                <div class="col-md-6">

                    <label
                        class="form-label-custom"
                        for="brand"
                    >
                        Brand
                    </label>

                    <input
                        type="text"
                        class="custom-input"
                        id="brand"
                        name="brand"
                        placeholder="Enter brand"
                        value="{{ product.brand }}"
                    >

                </div>


                <!-- Price -->
                <div class="col-md-3">

                    <label
                        class="form-label-custom"
                        for="price"
                    >
                        Price
                    </label>

                    <div class="input-with-prefix">

                        <span>₹</span>

                        <input
                            type="number"
                            step="0.01"
                            class="custom-input"
                            id="price"
                            name="price"
                            placeholder="0.00"
                            value="{{ product.price }}"
                        >

                    </div>

                </div>


                <!-- MRP -->
                <div class="col-md-3">

                    <label
                        class="form-label-custom"
                        for="mrp"
                    >
                        MRP
                    </label>

                    <div class="input-with-prefix">

                        <span>₹</span>

                        <input
                            type="number"
                            step="0.01"
                            class="custom-input"
                            id="mrp"
                            name="mrp"
                            placeholder="0.00"
                            value="{{ product.mrp }}"
                        >

                    </div>

                </div>

            </div>


            <!-- Actions -->
            <div class="form-actions">

                <a
                    href="{{ url_for('products') }}"
                    class="cancel-btn"
                >
                    Cancel
                </a>

                <button
                    type="submit"
                    class="save-btn"
                >
                    ✓ Update Product
                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
